name: BiletFlow integration

on:
  push:
    branches: [integration/biletflow-e2e]
  pull_request:
    branches: [integration/biletflow-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biletflow_test
          POSTGRES_DB: biletflow_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und"
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-test-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U biletflow_test -d biletflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://biletflow_test:${{ github.run_id }}-${{ github.run_attempt }}-test-only@127.0.0.1:5432/biletflow_test
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_ROUNDS: '4'
      VITE_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and generate disposable JWT key
        run: |
          python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('JWT_SECRET_KEY='+secrets.token_hex(64)+'\n')"
          pip install -r backend/requirements-dev.txt
      - name: Verify PostgreSQL 16 ICU settings
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          expected = {
              "major": 16,
              "provider": "i",
              "locale": "und",
              "encoding": "UTF8",
              "kazakh_casefold_ok": True,
          }
          query = text("""
              SELECT current_setting('server_version_num')::integer / 10000 AS major,
                     datlocprovider::text AS provider, daticulocale AS locale,
                     pg_encoding_to_char(encoding) AS encoding,
                     lower('ӘЛИЯ') = 'әлия' AS kazakh_casefold_ok
              FROM pg_database
              WHERE datname = current_database()
          """)
          with create_engine(os.environ["DATABASE_URL"]).connect() as connection:
              actual = dict(connection.execute(query).mappings().one())
          if actual != expected:
              raise SystemExit(f"Unsupported W2 test database configuration: {actual}")
          print("PostgreSQL 16, ICU und, UTF8 and Kazakh case folding verified")
          PY
      - name: Backend unit tests
        working-directory: backend
        run: pytest -q tests
      - name: Migrate fresh PostgreSQL and start the API
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/biletflow-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/biletflow-api.pid"
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health
      - name: PostgreSQL schema, integrity and concurrency
        working-directory: backend
        env:
          RUN_POSTGRES_E2E: '1'
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest -q e2e
      - name: Web install, TypeScript, unit tests and production build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser suite with real authentication and tickets
        working-directory: web
        env:
          RUN_LIVE_AUTH: '1'
          RUN_LIVE_TICKETS: '1'
        run: npm run test:browser
      - name: Stop only this job's API
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/biletflow-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/biletflow-api.pid")" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! curl --silent --max-time 1 --output /dev/null http://127.0.0.1:8000/health; then
                exit 0
              fi
              sleep 0.25
            done
            echo "The test API did not stop in time" >&2
            exit 1
          fi
      - name: Real API outage and recovery
        working-directory: web
        env:
          RUN_LIVE_RECOVERY: '1'
        run: npm run test:browser -- auth-recovery.live.spec.mjs

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Mobile checks and JavaScript exports
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint
          npm test
          npx expo export --platform android --output-dir dist/android
          npx expo export --platform ios --output-dir dist/ios
